<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOTCARD | Football player Card Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="header">
        <h1>FOOTCARD</h1>
    </div>
    <div class="main">
        <div class="aside">
            <button id="start">START</button>
            <p>
                Click the `START` button to create a random player 
            </p>
        </div>
        <div class="principal">
            <div class="info-one">
                <div class="frame"></div>
                <div class="player-info1">
                    <div class="iPlayer">First Name :</div>
                    <div class="iPlayer">Last Name :</div>
                    <div class="iPlayer">Age :</div>
                    <div class="iPlayer">Nationality</div>
                </div>
                <div class="player-infos2">
                    <div class="iPlayer">Position :</div>
                    <div class="iPlayer">Height :</div>
                    <div class="iPlayer">Weight :</div>
                    <div class="iPlayer">Preferred Foot :</div>
                </div>
            </div>
            <div class="info-two">
                <div class="ovr-display"></div>
                <div class="abilities-display">
                    <div class="pac ab"></div>
                    <div class="sho ab"></div>
                    <div class="pas ab"></div>
                    <div class="dri ab"></div>
                    <div class="def ab"></div>
                    <div class="phy ab"></div>
                    <div class="gk ab"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        Produced by Danseo 
    </div>
</body>
</html>
